[package]
name          = "wrapper-ble-esp32c3mini"
version       = "1.1.0"
edition       = "2024"
authors       = ["Jorge Andre Castro <georgeandrec@gmail.com>"] 
license = "MIT OR Apache-2.0"
description   = "A no_std BLE (GATT peripheral) wrapper for ESP32-C3 Mini, built on trouble-host, bt-hci and esp-radio"
repository    = "https://github.com/jorgeandrecastro/wrapper-ble-esp32c3mini" 
documentation = "https://docs.rs/wrapper-ble-esp32c3mini"
readme        = "README.md"
keywords      = ["embedded", "ble", "bluetooth", "esp32c3", "no-std"]
categories    = ["embedded", "no-std", "hardware-support", "asynchronous"]

[dependencies]
# --- Embassy stack (async no_std) ---
# No platform feature is enabled here intentionally: the final binary
# (via esp-hal-embassy) must choose the RISC-V executor and start the event
# loop. This library only defines futures; it does not create an executor.
embassy-executor = "0.10"
embassy-time     = "0.5.1"
embassy-futures  = "0.1.2"
# Direct dependency required by the expansion of the #[gatt_server] /
# #[gatt_service] macros from trouble-host-macros 0.4.0 (the version
# resolved by trouble-host 0.6.0, which requires `trouble-host-macros ^0.4.0`):
# generated code references `embassy_sync::...` without a trouble_host
# re-export, so `embassy-sync` must be a direct dependency of this crate,
# not just a transitive dependency of trouble-host.
embassy-sync = "0.7"

# --- BLE stack (host + HCI) ---
# trouble-host 0.6.x is the latest branch that depends on bt-hci ^0.8,
# matching the version of bt-hci exposed by esp-radio 0.18.0. trouble-host
# 0.7/0.8 use bt-hci ^0.9/^0.10 and are therefore incompatible with
# esp-radio 0.18.0 until the latter is updated.
trouble-host = "0.6.0"
bt-hci        = "0.8.1"

# --- Allocation-free structures ---
heapless   = "0.9"
static_cell = "2.1.1"

# --- Espressif HAL and radio stack ---
# esp-radio 0.18.0 requires `esp-hal ~1.1.0-rc.0` (the 1.1.x branch, not 1.2.x)
# and `bt-hci ^0.8.0`: the versions below are the latest that satisfy both
# constraints simultaneously.
esp-hal = { version = "1.1.2", features = ["esp32c3", "unstable"] }
esp-radio = { version = "0.18.0", features = ["esp32c3", "ble", "unstable"] }

# --- Logging ---
# Use the `log` facade rather than requiring `esp-println` directly:
# `esp-println` declares `links = "esp-println"` (only one version in the
# entire dependency tree) AND requires exactly one output feature (`auto`,
# `uart`, `jtag-serial`, `no-op`). A library should not make this choice for
# the final binary. With `log`, the binary chooses its backend (for example
# `esp-println` with its `log-04` feature, `defmt`, or another backend);
# the library only emits messages through the standard facade.
log = { version = "0.4", default-features = false }

[package.metadata.docs.rs]
default-target = "riscv32imc-unknown-none-elf"
targets = ["riscv32imc-unknown-none-elf"]

[profile.release]
opt-level     = "z"
lto           = true  # Link-Time Optimization
codegen-units = 1
panic         = "abort"
strip         = true